<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Digital Ghuru</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 16px;
      border-radius: 9999px;
      background-color: #fff7ed;
      border: 1px solid #fed7aa;
      color: #ea580c;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 12px;
      color: #0f172a;
    }
    h1 span {
      color: #006FFF;
    }
    h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1e293b;
    }
    p {
      color: #475569;
      font-size: 16px;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: #006FFF;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #0056cc;
    }
    .btn-secondary {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="badge">Error 404 • Missing Resource</div>
  <h1>4<span>0</span>4</h1>
  <h2>Lost in the Digital Landscape?</h2>
  <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
  <div class="buttons">
    <a href="/" class="btn btn-primary">Back to Homepage</a>
    <a href="/contact" class="btn btn-secondary">Contact Admissions</a>
  </div>
</body>
</html>
